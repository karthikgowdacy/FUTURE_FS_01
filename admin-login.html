<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Karthik</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      width: min(480px, 100%);
      padding: 2rem;
    }
    .login-card h1 {
      margin-top: 0;
    }
    .login-card input {
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .login-card button {
      margin-top: 1.5rem;
      width: 100%;
    }
    .login-status {
      margin-top: 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Admin login</h1>
      <p>Enter your password to view messages sent to Karthik.</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required />
        <button type="submit" class="btn btn-primary">Continue</button>
      </form>
      <p id="login-status" class="login-status"></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('login-status');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value.trim();
      if (!password) {
        status.textContent = 'Please enter the password.';
        return;
      }
      window.location.href = `/admin/messages?pwd=${encodeURIComponent(password)}`;
    });
  </script>
</body>
</html>
