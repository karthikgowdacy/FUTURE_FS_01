<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Portfolio Inquiries | Karthik Gowda</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      padding-bottom: 4rem;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      padding: 1.5rem;
    }
    .stat-card h4 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .stat-card .val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-primary);
    }
    .message-card {
      padding: 1.75rem;
      margin-bottom: 1.25rem;
      position: relative;
      transition: var(--transition-smooth);
    }
    .message-card:hover {
      border-color: var(--border-glow);
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .msg-sender {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .msg-email {
      font-size: 0.9rem;
      color: var(--accent-primary);
    }
    .msg-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .msg-body {
      font-size: 0.98rem;
      color: var(--text-secondary);
      line-height: 1.6;
      background: var(--surface-card);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      margin-top: 0.75rem;
    }
    .delete-msg-btn {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.8rem;
      transition: var(--transition-smooth);
    }
    .delete-msg-btn:hover {
      background: rgba(239, 68, 68, 0.2);
    }
    .search-box {
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="admin-header">
      <div>
        <a class="brand" href="/">
          <span class="brand-logo">&lt;K/&gt;</span>
          <span class="brand-text">Karthik Gowda Admin Portal</span>
        </a>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
          Inquiry messages submitted through your portfolio contact form.
        </p>
      </div>
      <div>
        <a href="/" class="btn btn-secondary btn-small">
          <i class="fa-solid fa-arrow-left"></i> Back to Website
        </a>
        <button id="refresh-btn" class="btn btn-primary btn-small">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="admin-stats">
      <div class="stat-card glass-card">
        <h4>Total Inquiries</h4>
        <div class="val" id="total-count">0</div>
      </div>
      <div class="stat-card glass-card">
        <h4>Latest Inquiry</h4>
        <div class="val" id="latest-time" style="font-size: 1rem; margin-top:0.4rem;">None</div>
      </div>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <div class="input-wrap">
        <i class="fa-solid fa-magnifying-glass input-icon"></i>
        <input type="text" id="search-input" placeholder="Filter messages by name, email, or content..." />
      </div>
    </div>

    <!-- Message List -->
    <div id="messages-list">
      <div class="text-center" style="padding: 3rem 0; color: var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 1rem;">Loading messages from database...</p>
      </div>
    </div>
  </div>

  <script>
    let allMessages = [];
    let adminPassword = sessionStorage.getItem('inbox_admin_pass') || '';

    function fetchMessages() {
      if (!adminPassword) {
        adminPassword = prompt('Enter Karthik\'s secret password to access admin portal:') || '';
      }

      fetch('/api/messages', {
        headers: { 'x-admin-password': adminPassword }
      })
        .then((res) => {
          if (res.status === 401) {
            alert('Incorrect password. Access denied.');
            adminPassword = '';
            sessionStorage.removeItem('inbox_admin_pass');
            document.getElementById('messages-list').innerHTML = `
              <div class="glass-card" style="padding: 2rem; text-align: center; color: #ef4444;">
                <i class="fa-solid fa-lock fa-2x"></i>
                <p style="margin-top:0.5rem;">Access Denied. Incorrect admin password. Refresh page to try again.</p>
              </div>
            `;
            return null;
          }
          return res.json();
        })
        .then((data) => {
          if (data) {
            sessionStorage.setItem('inbox_admin_pass', adminPassword);
            allMessages = data || [];
            renderMessages(allMessages);
            updateStats(allMessages);
          }
        })
        .catch(() => {
          document.getElementById('messages-list').innerHTML = `
            <div class="glass-card" style="padding: 2rem; text-align: center; color: #ef4444;">
              <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
              <p style="margin-top:0.5rem;">Failed to connect to backend server. Make sure node server.js is running.</p>
            </div>
          `;
        });
    }

    function updateStats(messages) {
      document.getElementById('total-count').textContent = messages.length;
      if (messages.length > 0) {
        const latest = new Date(messages[0].receivedAt);
        document.getElementById('latest-time').textContent = latest.toLocaleDateString() + ' ' + latest.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } else {
        document.getElementById('latest-time').textContent = 'None';
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-list');

      if (!messages.length) {
        container.innerHTML = `
          <div class="glass-card text-center" style="padding: 3rem;">
            <i class="fa-solid fa-inbox fa-3x" style="color: var(--text-muted); margin-bottom: 1rem;"></i>
            <h3>No Messages Yet</h3>
            <p style="color: var(--text-secondary);">When visitors submit the portfolio contact form, their inquiries will show up here.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = messages.map((msg) => `
        <div class="message-card glass-card" id="msg-card-${msg.id}">
          <div class="msg-header">
            <div>
              <div class="msg-sender">${escapeHtml(msg.name)}</div>
              <a href="mailto:${escapeHtml(msg.email)}" class="msg-email"><i class="fa-solid fa-envelope"></i> ${escapeHtml(msg.email)}</a>
            </div>
            <div style="display:flex; align-items:center; gap: 1rem;">
              <span class="msg-time"><i class="fa-regular fa-clock"></i> ${new Date(msg.receivedAt).toLocaleString()}</span>
              <button class="delete-msg-btn" onclick="deleteMessage('${msg.id}')">
                <i class="fa-solid fa-trash-can"></i> Delete
              </button>
            </div>
          </div>
          <div class="msg-body">
            ${escapeHtml(msg.message)}
          </div>
        </div>
      `).join('');
    }

    function deleteMessage(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;

      fetch(`/api/messages/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      })
        .then((res) => res.json())
        .then((data) => {
          allMessages = allMessages.filter((m) => m.id !== id);
          renderMessages(allMessages);
          updateStats(allMessages);
        })
        .catch(() => alert('Failed to delete message.'));
    } }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    document.getElementById('refresh-btn').addEventListener('click', fetchMessages);
    
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allMessages.filter((m) =>
        m.name.toLowerCase().includes(q) ||
        m.email.toLowerCase().includes(q) ||
        m.message.toLowerCase().includes(q)
      );
      renderMessages(filtered);
    });

    // Initial load
    fetchMessages();
  </script>
</body>
</html>
